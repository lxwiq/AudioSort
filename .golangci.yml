# golangci-lint v2 configuration.
# Enables the standard linter set and restores the default error-handling
# exclusions (unchecked Close/Remove/etc.) that golangci-lint v1 applied
# out of the box, so pre-existing idiomatic `defer x.Close()` calls don't
# fail the lint job.
version: "2"

linters:
  default: standard
  exclusions:
    generated: lax
    presets:
      - std-error-handling
